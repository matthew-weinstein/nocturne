[pytest]
python_files = pytest_*.py
addopts = --embedded-services esp,idf --target esp32s3 --build-dir build-test -m "not manual_setup and not fault"
markers =
    manual_setup: needs the board prepared by hand first; run alone with -m manual_setup
    fault: flashes a fault-injection build from tests/system/build_faults.py; run with -m fault
filterwarnings = ignore::pytest.PytestExperimentalApiWarning
